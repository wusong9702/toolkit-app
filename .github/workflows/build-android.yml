name: 构建 Android 安装包

# 产出两种文件：
#   APK —— 可以直接发给别人安装，适合测试
#   AAB —— Google Play 上架必须用的格式
on:
  push:
    tags: ['v*'] # 打 v1.0.0 这样的标签时触发
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 生成 Capacitor 平台目录
        # ios/ android/ 不提交到仓库时，这里自动生成
        run: |
          npm ci
          npm run build
          [ -d android ] || npx cap add android
          npx cap sync android

      # ------ 签名配置（可选）------
      # 没有签名就走 debug 包，能装不能用上架。
      # 想出正式包：把 keystore 文件用 base64 编码后填到仓库 Secrets 里
      - name: 准备签名文件
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
          cat > android/keystore.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          storeFile=keystore.jks
          EOF

      - name: 构建 Debug APK
        if: ${{ github.event.inputs.build_type != 'release' && !startsWith(github.ref, 'refs/tags/v') }}
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: 构建 Release AAB + APK
        if: ${{ github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        run: cd android && ./gradlew bundleRelease assembleRelease --no-daemon

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            app/android/app/build/outputs/**/*.apk
            app/android/app/build/outputs/**/*.aab
          retention-days: 30
          if-no-files-found: warn
